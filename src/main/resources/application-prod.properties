# Production profile (SPRING_PROFILES_ACTIVE=prod, set by the Docker image).
# Secrets and URLs always come from environment variables (deploy/.env on the server).

# ===== Real client IPs behind Cloudflare -> Caddy =====
# Tomcat's RemoteIpValve takes the client IP from X-Forwarded-For, but only when the request comes
# from an internal address (the Caddy container on the Docker network). The API port is never
# published, and Caddy overwrites X-Forwarded-For with the verified Cloudflare client IP, so the
# IP used for guest credits and rate limits cannot be spoofed.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2[0-9]|3[0-1])\\.\\d{1,3}\\.\\d{1,3}|127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto

# ===== Never leak internals =====
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
server.server-header=
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ===== Logging: no debug output, no request bodies =====
logging.level.root=INFO
logging.level.com.docsaas=INFO
logging.level.org.springframework.web=WARN

# ===== Database pool sized for a small server =====
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:8}

# ===== JobRunr dashboard: only the API container serves it, bound to localhost by compose =====
jobrunr.dashboard.enabled=${JOBRUNR_DASHBOARD_ENABLED:false}
