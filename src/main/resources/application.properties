spring.application.name=docsaas-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Local secrets file (git-ignored). Environment variables take precedence.
spring.config.import=optional:file:./config/application-secrets.properties

server.port=${PORT:8080}

# ===== DATABASE =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/docsaas_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ===== JWT =====
jwt.secret=${JWT_SECRET}
# 24 hours
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ===== GOOGLE OAUTH =====
google.client-id=${GOOGLE_CLIENT_ID:198678155341-ksdu1e5q2vi15sotfgr1k7kengm7jgk5.apps.googleusercontent.com}

# ===== CORS =====
docsaas.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ===== FILE STORAGE & LIMITS =====
docsaas.storage.dir=${STORAGE_DIR:./storage}
# How long uploaded inputs and generated outputs are kept
docsaas.retention.minutes=${RETENTION_MINUTES:60}
docsaas.limits.max-files=20
docsaas.limits.guest-jobs-per-hour=${GUEST_JOBS_PER_HOUR:30}
docsaas.limits.user-jobs-per-hour=${USER_JOBS_PER_HOUR:200}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:200MB}

# ===== JOB ENGINE (JobRunr OSS, jobs persisted in MySQL) =====
# Scale out: run extra instances with the same DB. Set JOB_WORKER_ENABLED=false on
# API-only instances and true on worker instances.
jobrunr.background-job-server.enabled=${JOB_WORKER_ENABLED:true}
jobrunr.background-job-server.worker-count=${JOB_WORKERS:2}
jobrunr.background-job-server.poll-interval-in-seconds=5
jobrunr.jobs.default-number-of-retries=2
jobrunr.jobs.retry-back-off-time-seed=3
jobrunr.background-job-server.delete-succeeded-jobs-after=PT2H
jobrunr.background-job-server.permanently-delete-deleted-jobs-after=PT24H
jobrunr.miscellaneous.allow-anonymous-data-usage=false
jobrunr.dashboard.enabled=${JOBRUNR_DASHBOARD_ENABLED:true}
jobrunr.dashboard.port=${JOBRUNR_DASHBOARD_PORT:8000}
jobrunr.dashboard.username=${JOBRUNR_DASHBOARD_USER:admin}
jobrunr.dashboard.password=${JOBRUNR_DASHBOARD_PASSWORD:change-me}
# Attempts per job for unexpected failures (bad input is never retried)
docsaas.jobs.max-attempts=3
# Jobs still unfinished after this long are failed by the sweeper
docsaas.jobs.stuck-after-minutes=30

# ===== OCR (Tesseract) =====
# Folder containing <lang>.traineddata files (e.g. eng, hin)
docsaas.ocr.tessdata=${TESSDATA_DIR:./tessdata}
docsaas.ocr.dpi=${OCR_DPI:200}
docsaas.ocr.max-pages=${OCR_MAX_PAGES:50}

# ===== WORD TO PDF (LibreOffice headless) =====
# Leave empty to auto-detect soffice in standard install locations
docsaas.libreoffice.path=${LIBREOFFICE_PATH:}
docsaas.libreoffice.timeout-seconds=120

# ===== AI (any OpenAI-compatible API: Gemini free tier, Groq, OpenRouter, Ollama) =====
# Gemini:    https://generativelanguage.googleapis.com/v1beta/openai   model gemini-3.5-flash (2.5 is closed to new keys)
# Groq:      https://api.groq.com/openai/v1                           model llama-3.3-70b-versatile
# OpenRouter https://openrouter.ai/api/v1                             model <any :free model>
# Ollama:    http://localhost:11434/v1                                model llama3.2 (api key: ollama)
docsaas.ai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
docsaas.ai.api-key=${AI_API_KEY:}
docsaas.ai.model=${AI_MODEL:gemini-3.5-flash}
# Thinking models (Gemini 3.x, o-series): "low" keeps answers fast. Leave empty for providers without reasoning.
docsaas.ai.reasoning-effort=${AI_REASONING_EFFORT:low}
# Extra output tokens reserved for the model's thinking, on top of each answer's budget
docsaas.ai.thinking-headroom-tokens=${AI_THINKING_HEADROOM:2048}
docsaas.ai.timeout-seconds=90
# Cost/abuse controls
docsaas.ai.max-pages=${AI_MAX_PAGES:100}
docsaas.ai.max-input-chars=${AI_MAX_INPUT_CHARS:120000}
docsaas.limits.guest-chat-per-hour=30
docsaas.limits.user-chat-per-hour=120

# ===== CREDITS (daily allowance, resets at midnight server time) =====
# Guests: GUEST_DAILY_CREDITS a day, no AI tools. Logged-in users: USER_DAILY_CREDITS a day, all tools.
# Failed jobs never count. false = record usage only, never block.
docsaas.credits.enforce=${CREDITS_ENFORCE:true}
docsaas.credits.guest-daily=${GUEST_DAILY_CREDITS:3}
docsaas.credits.user-daily=${USER_DAILY_CREDITS:30}
docsaas.credits.cost.standard=1
# AI summary, document insights, chat with PDF
docsaas.credits.cost.ai=3

# ===== EMAIL (SMTP) - password reset mails =====
# Free options: Gmail (smtp.gmail.com:587, needs a Google "App password"), Brevo (smtp-relay.brevo.com:587, 300/day free).
# Leave MAIL_HOST empty in development: reset links are then written to the server log instead of emailed.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
docsaas.mail.from=${MAIL_FROM:DocSaaS <no-reply@docsaas.local>}
# Public URL of the frontend, used in links inside emails
docsaas.frontend-url=${FRONTEND_URL:http://localhost:5173}
docsaas.password-reset.valid-minutes=30
