# Single-host deployment: MySQL + API + background workers.
#   docker compose up -d --build
#   docker compose up -d --scale worker=3     # more workers for heavy OCR/conversion load
# Secrets come from a .env file next to this one (see README).
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: docsaas_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10

  # Serves the REST API and enqueues jobs; does not process them.
  api:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment: &app-env
      DB_URL: jdbc:mysql://mysql:3306/docsaas_db
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      AI_BASE_URL: ${AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-3.5-flash}
      JOBRUNR_DASHBOARD_PASSWORD: ${JOBRUNR_DASHBOARD_PASSWORD}
      JOB_WORKER_ENABLED: "false"
    ports:
      - "8080:8080"
      - "127.0.0.1:8000:8000"   # JobRunr dashboard: localhost only, reach it over SSH
    volumes:
      - storage:/data/storage

  # Processes jobs from the MySQL-backed queue. Scale with --scale worker=N.
  worker:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      <<: *app-env
      JOB_WORKER_ENABLED: "true"
      JOB_WORKERS: "2"
      JOBRUNR_DASHBOARD_ENABLED: "false"
      PORT: "8081"
    volumes:
      - storage:/data/storage   # must be shared with api: uploads in, results out

volumes:
  mysql-data:
  storage:
